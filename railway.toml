[build]
builder = "nixpacks"
buildCommand = "npm install && npm run build --workspace=backend && echo 'Build complete, checking dist:' && ls -la backend/dist/ && echo 'Working directory:' && pwd"

[deploy]
startCommand = "cd backend && node dist/index.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
